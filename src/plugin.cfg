[configuration]
id = "ScoreTracker"
name = "ScoreTracker"
description = "Records explicitly completed pinball games to a documented scores.json format"
author = "Andre Santana"
version = "0.1.23"
link = "https://github.com/herrMirto/vpx-scoretracker-plugin"

[libraries]
windows.x86 = "plugin-scoretracker.dll"
windows.x64 = "plugin-scoretracker64.dll"
windows.arm64 = "plugin-scoretracker64.dll"
linux.x64 = "plugin-scoretracker.so"
linux.aarch64 = "plugin-scoretracker.so"
macos.x64 = "plugin-scoretracker.dylib"
macos.arm64 = "plugin-scoretracker.dylib"
