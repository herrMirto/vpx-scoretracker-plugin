name: Build portable ScoreTracker packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: ubuntu-24.04
            platform: linux-x64
          # Windows ZIPs are currently distributed without code signing.
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Linux desktop test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate project
        shell: bash
        run: python3 scripts/validate-project.py
      - name: Stage pinned public plugin SDK
        shell: bash
        run: bash platforms/${{ matrix.platform }}/external.sh
      - name: Build standalone plugin
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
      - name: Ad-hoc sign local macOS module
        if: runner.os == 'macOS'
        run: codesign --force --sign - build/scoretracker/plugin-scoretracker.dylib
      - name: Test completed-game contract
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build and test Viewer
        shell: bash
        run: |
          npm --prefix companion ci
          npm --prefix companion test
          npm --prefix companion run build
          npm --prefix companion run package
      - name: Test desktop window
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run -a npm --prefix companion run test:desktop
          else
            npm --prefix companion run test:desktop
          fi
      - name: Create portable ZIPs
        shell: bash
        run: |
          python3 scripts/package-plugin.py --platform ${{ matrix.platform }}
          python3 scripts/package-viewer.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: scoretracker-${{ matrix.platform }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: python3 scripts/check-version.py --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: scoretracker-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
