name: Upstream compatibility
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        sdk: [pinned, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve current upstream revisions
        if: matrix.sdk == 'latest'
        shell: bash
        run: |
          echo "VPINBALL_SHA=$(git ls-remote https://github.com/vpinball/vpinball.git HEAD | cut -f1)" >> "$GITHUB_ENV"
      - run: bash tests/run-compatibility.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-${{ matrix.os }}-${{ matrix.sdk }}
          path: third-party/include/revisions.txt
  maps:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        revision: [eba90209c329acaaa129ad8077ef63d8d0c43958, master]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: tomlogic/pinball-memory-maps
          ref: ${{ matrix.revision }}
          path: upstream-maps
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm --prefix companion ci
      - run: npm --prefix companion run test:maps
        env:
          SCORETRACKER_MAPS_ROOT: ${{ github.workspace }}/upstream-maps
      - run: git -C upstream-maps rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
